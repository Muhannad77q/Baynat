<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#160b08" />
    <title>لَذَّة — إعلان كيكة الفراولة</title>
    <meta
      name="description"
      content="إعلان عمودي متحرك لكيكة الفراولة: المكونات، التركيب، اللمسات الأخيرة، والتقديم."
    />
    <link rel="stylesheet" href="./styles.css?v=2" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main class="studio-shell">
      <section class="preview-column" aria-label="معاينة الإعلان">
        <div class="preview-frame">
          <canvas
            id="adCanvas"
            width="1080"
            height="1920"
            role="img"
            aria-label="إعلان متحرك يوضح مكونات كيكة الفراولة وطريقة تركيبها وتقديمها"
          ></canvas>
          <div class="preview-glare" aria-hidden="true"></div>
        </div>
        <p class="preview-caption"><span class="live-dot"></span> معاينة مباشرة • تتكرر تلقائيًا</p>
      </section>

      <section class="control-panel" aria-labelledby="pageTitle">
        <header class="panel-header">
          <div class="brand-lockup" aria-label="لذة">
            <span class="brand-mark">ل</span>
            <span>لَذَّة</span>
          </div>
          <span class="format-pill">9:16</span>
        </header>

        <div class="panel-copy">
          <p class="eyebrow">فيلم منتج • ١٨ ثانية</p>
          <h1 id="pageTitle">الكيكة تركب<br />قدّام عيونك.</h1>
          <p>
            إعلان عربي أنيق مستوحى من الكريمة البيضاء، قلب الفراولة، التوت، وقطع الشوكولاتة في الكيكة الأصلية.
          </p>
        </div>

        <div class="timeline" aria-label="مشاهد الإعلان">
          <div class="timeline-track" aria-hidden="true">
            <span id="timelineProgress"></span>
          </div>
          <div class="timeline-steps">
            <button type="button" data-seek="0" class="active">
              <span>01</span>
              <strong>الافتتاح</strong>
            </button>
            <button type="button" data-seek="2800">
              <span>02</span>
              <strong>المكونات</strong>
            </button>
            <button type="button" data-seek="5900">
              <span>03</span>
              <strong>التركيب</strong>
            </button>
            <button type="button" data-seek="14500">
              <span>04</span>
              <strong>التقديم</strong>
            </button>
          </div>
        </div>

        <div class="controls" aria-label="أدوات تشغيل الإعلان">
          <button type="button" id="playButton" class="control-button">
            <span class="button-icon" aria-hidden="true">Ⅱ</span>
            <span>إيقاف</span>
          </button>
          <button type="button" id="replayButton" class="control-button">
            <span class="button-icon replay-icon" aria-hidden="true">↻</span>
            <span>إعادة</span>
          </button>
          <button type="button" id="soundButton" class="control-button">
            <span class="button-icon" aria-hidden="true">♪</span>
            <span>الصوت</span>
          </button>
        </div>

        <button type="button" id="exportButton" class="export-button">
          <span>
            <small>نسخة جاهزة للنشر</small>
            تصدير الفيديو
          </span>
          <span class="export-arrow" aria-hidden="true">↙</span>
        </button>
        <p id="exportStatus" class="export-status" aria-live="polite">
          1080 × 1920 • 30 FPS • صوت مصمم خصيصًا
        </p>

        <footer class="panel-footer">
          <span>فراولة</span>
          <i></i>
          <span>فانيلا</span>
          <i></i>
          <span>شوكولاتة</span>
        </footer>
      </section>
    </main>

    <script type="module" src="./app.js?v=2"></script>
  </body>
</html>
